# AVAL Local AI Stack: pinned versions. Edit, test, then tag a release.
# Format: KEY=VALUE, no spaces around "=".

STACK_VERSION=0.1.0-draft

# Minimum Ollama version. 0.17.1 fixes CVE-2026-7482 ("Bleeding Llama").
# Raise this whenever a new Ollama security fix ships.
OLLAMA_MIN_VERSION=0.17.1
# Version the maintainer tested (informational; verify warns if different).
OLLAMA_TESTED_VERSION=

# goose Desktop version the maintainer tested (informational on macOS, where Homebrew installs it).
GOOSE_TESTED_VERSION=

# Windows goose Desktop: exact release zip URL and its SHA-256, recorded by the
# maintainer after downloading and vetting it. The installer REFUSES to install
# goose on Windows while GOOSE_WIN_SHA256 is blank.
GOOSE_WIN_ZIP_URL=
GOOSE_WIN_SHA256=

# Extension allowlist URL (see docs/QUESTIONS.md Q6). Blank = no allowlist.
GOOSE_ALLOWLIST_URL=

# GitHub repo holding team goose recipes, e.g. blaggr/aval-goose-recipes. Blank = none.
GOOSE_RECIPE_REPO=

# Default context window, in tokens, sent by goose to Ollama. Larger = more RAM.
CONTEXT_TOKENS=16384
